name: Build Diamond Crush
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld make gcc zip unzip file
      - name: Test and package
        run: make check && make
      - name: Verify archive
        run: |
          unzip -t dist/q2-diamond-crush.zip
          unzip -p dist/q2-diamond-crush.zip .diamond-crush/q2app | grep -Fx 'game=1'
          file dist/.diamond-crush/q2-diamond-crush | grep -E 'ELF 32-bit LSB.*MIPS'
      - uses: actions/upload-artifact@v4
        with:
          name: q2-diamond-crush-card-app
          path: dist/q2-diamond-crush.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: q2-diamond-crush-card-app
          path: dist
      - name: Release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/q2-diamond-crush.zip --clobber
          else
            gh release create "$TAG" dist/q2-diamond-crush.zip --verify-tag --generate-notes
          fi
