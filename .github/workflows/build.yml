name: Build Diamond Crush
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host toolchain and sprite dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make python3 python3-pil libasound2-dev
      - name: Test the portable game engine
        run: make check
      - name: Check ALSA and device-runtime C syntax
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Isrc -fsyntax-only src/audio.c
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Isrc -fsyntax-only src/platform_q2.c

  device-build:
    # Q2 ALSA requires a sysroot derived from the user's stock firmware.
    # Set repository variable Q2_SYSROOT_URL to a trusted .tar.gz archive
    # with lib/ and usr/ at its root. Keep proprietary sysroots private.
    if: ${{ vars.Q2_SYSROOT_URL != '' }}
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang lld make gcc python3 python3-pil zip unzip file curl
      - name: Install Q2 firmware sysroot
        env:
          Q2_SYSROOT_URL: ${{ vars.Q2_SYSROOT_URL }}
        run: |
          mkdir -p "$HOME/.cache/q2/sysroot"
          curl --fail --location --silent --show-error "$Q2_SYSROOT_URL" | tar -xz -C "$HOME/.cache/q2/sysroot"
          test -f "$HOME/.cache/q2/sysroot/lib/libasound.so.2"
      - name: Build and package device card
        run: make
      - name: Verify install ZIP
        run: |
          unzip -t dist/q2-diamond-crush.zip
          unzip -p dist/q2-diamond-crush.zip .diamond-crush/q2app | grep -Fx 'game=1'
          unzip -p dist/q2-diamond-crush.zip .diamond-crush/q2app | grep -Fx 'audio=1'
          file dist/.diamond-crush/q2-diamond-crush | grep -E 'ELF 32-bit LSB.*MIPS'
      - uses: actions/upload-artifact@v4
        with:
          name: q2-diamond-crush-card-app
          path: dist/q2-diamond-crush.zip
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.Q2_SYSROOT_URL != '' }}
    needs: device-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: q2-diamond-crush-card-app
          path: dist
      - name: Publish card ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/q2-diamond-crush.zip --clobber
          else
            gh release create "$TAG" dist/q2-diamond-crush.zip --verify-tag --generate-notes
          fi
