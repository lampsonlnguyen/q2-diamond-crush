name: Build Diamond Crush
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Host toolchain and sprite dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make python3 python3-pil libasound2-dev
      - name: Test the portable game engine
        run: make check
      - name: Check ALSA and device-runtime C syntax
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Isrc -fsyntax-only src/audio.c
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Isrc -fsyntax-only src/platform_q2.c

  device-build:
    # Build the ALSA/MIPS sysroot from fw/Q2 Firmware V1.36.zip checked into
    # this repository. The helper supplies Debian headers and extracts the
    # stock firmware's matching, NaN2008-compatible shared libraries.
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang lld make gcc python3 python3-pil zip unzip file curl binutils xz-utils squashfs-tools
      - name: Build Q2 firmware sysroot
        run: |
          set -euo pipefail
          firmware="fw/Q2 Firmware V1.36.zip"
          test -s "$firmware"
          unzip -Z1 "$firmware" | grep -Fx 'Q2 Firmware V1.36/update.tar'
          git clone --depth 1 https://github.com/DiamondBond/q2-rockbox.git /tmp/q2-rockbox
          cp /tmp/q2-rockbox/tools/shanlingq2/mksysroot.sh /tmp/mksysroot-v136.sh
          # The helper pins V1.32; adapt its archive path and checksum to the
          # firmware committed to this repository without changing extraction.
          sed -i 's/Q2 Firmware V1.32/Q2 Firmware V1.36/g' /tmp/mksysroot-v136.sh
          sha=$(sha256sum "$firmware" | cut -d' ' -f1)
          sed -i "s/154c17822d09be001be35c03d2d3488424dee195221790bd70864480d55b0f00/$sha/g" /tmp/mksysroot-v136.sh
          sh /tmp/mksysroot-v136.sh "$firmware" "$HOME/.cache/q2/sysroot"
          test -f "$HOME/.cache/q2/sysroot/lib/libasound.so.2"
          test -f "$HOME/.cache/q2/sysroot/usr/include/alsa/asoundlib.h"
      - name: Build and package device card
        run: make
      - name: Verify install ZIP
        run: |
          unzip -t dist/q2-diamond-crush.zip
          unzip -p dist/q2-diamond-crush.zip .diamond-crush/q2app | grep -Fx 'game=1'
          unzip -p dist/q2-diamond-crush.zip .diamond-crush/q2app | grep -Fx 'audio=1'
          file dist/.diamond-crush/q2-diamond-crush | grep -E 'ELF 32-bit LSB.*MIPS'
      - uses: actions/upload-artifact@v6
        with:
          name: q2-diamond-crush-card-app
          path: dist/q2-diamond-crush.zip
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: device-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: q2-diamond-crush-card-app
          path: dist
      - name: Publish card ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/q2-diamond-crush.zip --clobber
          else
            gh release create "$TAG" dist/q2-diamond-crush.zip --verify-tag --generate-notes
          fi
